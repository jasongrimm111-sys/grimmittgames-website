# Christmas Day 2026: publishes the keys that unlock the presents on grimmittgames.com/andy and grimmittgames.com/giada
# (the vouchers are on the site only in encrypted form; the keys are the repository secrets GIFT_KEY and GIFT_KEY_GIADA).
# Runs a few times after midnight in case GitHub delays a scheduled run; does nothing once a key is out, or before the day.
name: Unlock the Christmas presents
on:
  schedule:
    - cron: '1 0 25 12 *'
    - cron: '20 0 25 12 *'
    - cron: '0 1 25 12 *'
    - cron: '0 3 25 12 *'
    - cron: '0 7 25 12 *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the keys (from 25 December 2026 only)
        env:
          GIFT_KEY: ${{ secrets.GIFT_KEY }}
          GIFT_KEY_GIADA: ${{ secrets.GIFT_KEY_GIADA }}
        run: |
          if [ "$(date -u +%Y%m%d)" -lt 20261225 ]; then echo "Not Christmas Day yet"; exit 0; fi
          changed=0; missing=0
          if [ ! -f andy/key.json ]; then
            if [ -n "$GIFT_KEY" ]; then printf '{"k":"%s"}\n' "$GIFT_KEY" > andy/key.json; git add andy/key.json; changed=1; else echo "The GIFT_KEY secret is missing"; missing=1; fi
          fi
          if [ ! -f giada/key.json ]; then
            if [ -n "$GIFT_KEY_GIADA" ]; then printf '{"k":"%s"}\n' "$GIFT_KEY_GIADA" > giada/key.json; git add giada/key.json; changed=1; else echo "The GIFT_KEY_GIADA secret is missing"; missing=1; fi
          fi
          if [ "$changed" = 1 ]; then
            git config user.name "Grimmitt Games"
            git config user.email "contact@grimmittgames.com"
            git commit -m "Merry Christmas"
            git push
          else echo "Nothing to unlock"; fi
          exit $missing
